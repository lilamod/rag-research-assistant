services:
  - type: web
    name: rag-research-assistant-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      # Free-tier hosts (512MB RAM) can't fit torch/sentence-transformers,
      # so embeddings run through Gemini's API instead of the local model.
      # Gemini has a genuinely free tier (1,500 requests/day) with no card
      # required at all - get a key at https://aistudio.google.com/apikey.
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: CORS_ORIGINS
        value: "*"
