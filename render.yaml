services:
  - type: web
    name: rag-research-assistant-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      # Free-tier hosts (512MB RAM) can't fit torch/sentence-transformers,
      # so embeddings run through OpenAI's API instead of the local model.
      # This needs its own OPENAI_API_KEY even if LLM_PROVIDER is anthropic.
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: CORS_ORIGINS
        value: "*"
