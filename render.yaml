services:
  - type: web
    name: rag-research-assistant-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      # Free-tier hosts (512MB RAM) can't fit torch/sentence-transformers,
      # so embeddings run through Voyage AI's API instead of the local
      # model. Voyage has a genuine free tier (200M tokens), so this
      # needs a VOYAGE_API_KEY but no billing setup, unlike OpenAI's API.
      - key: EMBEDDING_PROVIDER
        value: voyage
      - key: VOYAGE_API_KEY
        sync: false
      - key: VOYAGE_EMBEDDING_MODEL
        value: voyage-4-lite
      - key: CORS_ORIGINS
        value: "*"
